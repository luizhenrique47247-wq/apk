name: Build FudidoFlix APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # Permite rodar manualmente pela interface do GitHub

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do repositório
      - name: Checkout código
        uses: actions/checkout@v4

      # 2. Configura o JDK 17
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Configura o Node.js para buildar o React
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 4. Instala dependências e faz build do React (FudidoFlix web)
      - name: Build do app React (FudidoFlix)
        working-directory: ./web
        run: |
          npm install
          npm run build

      # 5. Copia o build React para dentro dos assets do Android
      - name: Copiar build React para assets Android
        run: |
          mkdir -p app/src/main/assets/web
          cp -r web/dist/* app/src/main/assets/web/

      # 6. Dá permissão de execução ao Gradle Wrapper
      - name: Permissão Gradle Wrapper
        run: chmod +x ./gradlew

      # 7. Cache do Gradle para builds mais rápidos nas próximas vezes
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 8. Compila o APK de debug (não precisa de assinatura)
      - name: Compilar APK
        run: ./gradlew assembleDebug --stacktrace

      # 9. Sobe o APK como artefato para download
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FudidoFlix-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
